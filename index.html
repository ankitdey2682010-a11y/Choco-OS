<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate OS - Sweety Desktop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <link rel="stylesheet" href="styless.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        choco: {
                            950: '#120704',
                            900: '#210f07',
                            800: '#34180a',
                            700: '#4d240e',
                            600: '#683113',
                            500: '#854118',
                            400: '#a65620',
                            300: '#c57431',
                            200: '#df9c5d',
                            100: '#f1c798',
                            50: '#faede0'
                        },
                        cream: '#fff9ef',
                        caramel: '#d97706',
                        ruby: '#be123c',
                        mint: '#059669'
                    },
                    fontFamily: {
                        display: ['Fredoka', 'sans-serif'],
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen choco-wallpaper text-cream flex flex-col justify-between overflow-hidden relative">

    <div id="desktop" class="relative flex-1 w-full h-full p-6 z-10 overflow-hidden" onclick="closeStartMenu()">

        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-6 max-w-5xl">

            <div onclick="openApp('tycoon')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-700 to-choco-950 border border-amber-500/40 flex items-center justify-center text-amber-300 text-2xl shadow-xl group-hover:border-amber-400">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-amber-300">Cocoa Craft</span>
            </div>

            <div onclick="openApp('paint')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-600 to-rose-950 border border-rose-500/40 flex items-center justify-center text-rose-300 text-2xl shadow-xl group-hover:border-rose-400">
                    <i class="fa-solid fa-palette"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-rose-300">Choco Canvas</span>
            </div>

            <div onclick="openApp('audio')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-800 to-choco-950 border border-emerald-500/40 flex items-center justify-center text-emerald-300 text-2xl shadow-xl group-hover:border-emerald-400">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-emerald-300">Lo-Fi Beats</span>
            </div>

            <div onclick="openApp('match3')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-700 to-choco-950 border border-pink-500/40 flex items-center justify-center text-pink-300 text-2xl shadow-xl group-hover:border-pink-400">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-pink-300">Choco Swap</span>
            </div>

            <div onclick="openApp('notes')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-yellow-700 to-choco-950 border border-yellow-500/40 flex items-center justify-center text-yellow-300 text-2xl shadow-xl group-hover:border-yellow-400">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-yellow-300">Recipes</span>
            </div>

            <div onclick="openApp('calc')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-700 to-choco-950 border border-orange-500/40 flex items-center justify-center text-orange-300 text-2xl shadow-xl group-hover:border-orange-400">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-orange-300">Sweet Calc</span>
            </div>

            <div onclick="openApp('terminal')" class="group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer hover:bg-choco-800/40 transition-all hover:scale-105 active:scale-95 text-center">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-800 to-choco-950 border border-cyan-500/40 flex items-center justify-center text-cyan-300 text-2xl shadow-xl group-hover:border-cyan-400">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <span class="mt-2 text-xs font-display font-medium text-cream group-hover:text-cyan-300">Cocoa Shell</span>
            </div>

        </div>

    </div>

    <!-- WINDOWS CONTAINER -->
    <div id="window-container" class="fixed inset-0 pointer-events-none z-20"></div>

    <!-- START MENU OVERLAY -->
    <div id="start-menu" class="hidden fixed bottom-16 left-4 z-50 w-80 choco-panel rounded-3xl p-4 border border-amber-500/40 shadow-2xl flex flex-col gap-3">
        <div class="flex items-center gap-3 border-b border-choco-700/80 pb-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500 to-choco-800 flex items-center justify-center text-amber-200 text-xl font-bold shadow-md">
                <i class="fa-solid fa-crown text-amber-300"></i>
            </div>
            <div>
                <h3 class="font-display text-sm font-bold text-cream">Master Chocolatier</h3>
                <p class="text-[11px] text-amber-300/80 font-mono">choco-os</p>
            </div>
        </div>

        <div class="space-y-1 my-1">
            <div onclick="openApp('tycoon')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-industry text-amber-400 w-5 text-center"></i>
                <span class="text-xs font-display">Cocoa Craft Tycoon</span>
            </div>
            <div onclick="openApp('paint')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-palette text-rose-400 w-5 text-center"></i>
                <span class="text-xs font-display">Choco Canvas Studio</span>
            </div>
            <div onclick="openApp('audio')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-headphones text-emerald-400 w-5 text-center"></i>
                <span class="text-xs font-display">Lo-Fi Beats Synth</span>
            </div>
            <div onclick="openApp('match3')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-shapes text-pink-400 w-5 text-center"></i>
                <span class="text-xs font-display">Choco Swap Match-3</span>
            </div>
            <div onclick="openApp('notes')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-book-open text-yellow-400 w-5 text-center"></i>
                <span class="text-xs font-display">Recipes & Notes</span>
            </div>
            <div onclick="openApp('terminal')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-choco-700/50 cursor-pointer transition-colors">
                <i class="fa-solid fa-terminal text-cyan-400 w-5 text-center"></i>
                <span class="text-xs font-display">Cocoa Shell CLI</span>
            </div>
        </div>

        <div class="border-t border-choco-700/80 pt-2 flex items-center justify-between text-xs text-amber-300/80">
            <span class="font-mono text-[10px]">Status: Freshly Baked</span>
            <button onclick="playAudioTone(800, 'sine', 0.2)" class="hover:text-cream">
                <i class="fa-solid fa-power-off text-rose-400"></i>
            </button>
        </div>
    </div>

    <footer class="relative z-40 h-14 w-full choco-panel border-t border-amber-500/30 px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="toggleStartMenu(event)" class="choco-button px-3.5 py-1.5 rounded-xl flex items-center gap-2 text-xs font-display font-bold text-amber-300">
                <i class="fa-solid fa-cookie text-amber-400"></i> Start
            </button>
            
            <div id="taskbar-apps" class="flex items-center gap-2 overflow-x-auto max-w-md"></div>
        </div>

        <div class="flex items-center gap-4 text-xs">
            <button onclick="toggleMute()" id="audio-toggle-btn" class="text-amber-400 hover:text-amber-300 transition-colors">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <div id="taskbar-time" class="font-mono text-xs font-bold text-amber-300">12:00 PM</div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
